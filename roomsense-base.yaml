esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

bluetooth_proxy:

web_server:

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

packages:
  # presence / motion stack
  ld2410: !include components/ld2410.yaml
  ld2410-calibration: !include components/ld2410-calibration.yaml
  ira-s210st01: !include components/ira-s210st01.yaml
  direction-detection: !include components/direction-detection.yaml
  occupancy: !include components/occupancy.yaml
  # environment / indicators
  ambient-light: !include components/ambient-light.yaml
  led: !include components/rgb-led.yaml