
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

bluetooth_proxy:

web_server:

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

uart:
  - tx_pin: GPIO9
    rx_pin: GPIO8
    parity: NONE
    stop_bits: 1
    baud_rate: 256000
