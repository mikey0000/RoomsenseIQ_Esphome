esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

bluetooth_proxy:

web_server:

i2c:
  sda: GPIO12
  scl: GPIO13
  scan: true

uart:
  - tx_pin: GPIO9
    rx_pin: GPIO8
    parity: NONE
    stop_bits: 1
    baud_rate: 256000
    #debug:
    #  direction: BOTH
    #  dummy_receiver: false
    #  after:
    #    delimiter: "\n"
    #  sequence:
    #    - lambda: UARTDebug::log_string(direction, bytes);


packages:
  ambient-light: !include components/ambient-light.yaml
  led: !include components/led.yaml
  ld2410: !include components/ld2410.yaml
  ira-s210st01: !include components/ira-s210st01.yaml