ld2410:
  uart_id : ld2410_uart

uart:
  - tx_pin: GPIO9
    rx_pin: GPIO8
    parity: NONE
    stop_bits: 1
    baud_rate: 256000
    id: ld2410_uart
    #debug:
    #  direction: BOTH
    #  dummy_receiver: false
    #  after:
    #    delimiter: "\n"
    #  sequence:
    #    - lambda: UARTDebug::log_string(direction, bytes);

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
      id: ld2410_has_target
    has_moving_target:
      name: Moving Target
      id: ld2410_moving_target
    has_still_target:
      name: Still Target
    out_pin_presence_status:
      name: out pin presence status

sensor:
  - platform: ld2410
    light:
      name: light
      state_class: measurement
      filters:
        - throttle: 5s
    moving_distance:
      name : Moving Distance
      state_class: measurement
      filters:
        - throttle: 1s
    still_distance:
      name: Still Distance
      state_class: measurement
      filters:
        - throttle: 1s
    moving_energy:
      name: Move Energy
      state_class: measurement
      filters:
        - throttle: 1s
    still_energy:
      name: Still Energy
      state_class: measurement
      filters:
        - throttle: 1s
    detection_distance:
      name: Detection Distance
      id: ld2410_detection_distance
      state_class: measurement
      filters:
        # Reject single-frame spikes (radar jumps to 0/garbage at close
        # range); stock smooths with a slew-limited moving average
        # (ld2410.c:926-998).
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1
        # radar publishes per frame (~10Hz); 500ms keeps the 1s direction
        # loop fresh while cutting API/recorder chatter
        - throttle: 500ms
    g0:
      move_energy:
        name: g0 move energy
        id: g0_move_energy
      still_energy:
        name: g0 still energy
        id: g0_still_energy
    g1:
      move_energy:
        name: g1 move energy
        id: g1_move_energy
      still_energy:
        name: g1 still energy
        id: g1_still_energy
    g2:
      move_energy:
        name: g2 move energy
        id: g2_move_energy
      still_energy:
        name: g2 still energy
        id: g2_still_energy
    g3:
      move_energy:
        name: g3 move energy
        id: g3_move_energy
      still_energy:
        name: g3 still energy
        id: g3_still_energy
    g4:
      move_energy:
        name: g4 move energy
        id: g4_move_energy
      still_energy:
        name: g4 still energy
        id: g4_still_energy
    g5:
      move_energy:
        name: g5 move energy
        id: g5_move_energy
      still_energy:
        name: g5 still energy
        id: g5_still_energy
    g6:
      move_energy:
        name: g6 move energy
        id: g6_move_energy
      still_energy:
        name: g6 still energy
        id: g6_still_energy
    g7:
      move_energy:
        name: g7 move energy
        id: g7_move_energy
      still_energy:
        name: g7 still energy
        id: g7_still_energy
    g8:
      move_energy:
        name: g8 move energy
        id: g8_move_energy
      still_energy:
        name: g8 still energy
        id: g8_still_energy

