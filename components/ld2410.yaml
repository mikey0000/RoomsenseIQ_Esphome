# Stock RoomsenseIQ factory calibration (roomsense-iq firmware ld2410.c factory_reset()):
# absence timeout 20s, max move/still gate 8 (600cm), per-gate thresholds below.
# The ld2410 number entities read their values FROM the radar, and the radar
# persists settings in its own flash — so defaults are pushed once on first
# boot (guarded by a flag survived in NVS) and on demand via the button.
globals:
  - id: ld2410_stock_defaults_applied
    type: bool
    restore_value: true
    initial_value: 'false'

script:
  - id: ld2410_apply_stock_defaults
    mode: single
    then:
      - number.set: { id: ld2410_timeout, value: 20 }
      - number.set: { id: ld2410_max_move_gate, value: 8 }
      - number.set: { id: ld2410_max_still_gate, value: 8 }
      - delay: 200ms
      - number.set: { id: g0_move_threshold, value: 35 }
      - number.set: { id: g0_still_threshold, value: 25 }
      - number.set: { id: g1_move_threshold, value: 25 }
      - number.set: { id: g1_still_threshold, value: 15 }
      - number.set: { id: g2_move_threshold, value: 20 }
      - number.set: { id: g2_still_threshold, value: 10 }
      - delay: 200ms
      - number.set: { id: g3_move_threshold, value: 15 }
      - number.set: { id: g3_still_threshold, value: 10 }
      - number.set: { id: g4_move_threshold, value: 15 }
      - number.set: { id: g4_still_threshold, value: 10 }
      - number.set: { id: g5_move_threshold, value: 15 }
      - number.set: { id: g5_still_threshold, value: 10 }
      - delay: 200ms
      - number.set: { id: g6_move_threshold, value: 15 }
      - number.set: { id: g6_still_threshold, value: 10 }
      - number.set: { id: g7_move_threshold, value: 15 }
      - number.set: { id: g7_still_threshold, value: 10 }
      - number.set: { id: g8_move_threshold, value: 15 }
      - number.set: { id: g8_still_threshold, value: 10 }
      - globals.set:
          id: ld2410_stock_defaults_applied
          value: 'true'
      - logger.log: "LD2410 stock RoomsenseIQ defaults applied"

button:
  - platform: template
    name: "LD2410 Apply Stock Defaults"
    entity_category: config
    on_press:
      - script.execute: ld2410_apply_stock_defaults

esphome:
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: 'return !id(ld2410_stock_defaults_applied);'
          then:
            - delay: 10s  # let the radar settle before pushing config
            - script.execute: ld2410_apply_stock_defaults