output:
  - platform: ledc
    pin: GPIO46
    id: output_red
    channel: 0
    inverted: true
  - platform: ledc
    pin: GPIO10
    id: output_green
    channel: 1
    inverted: true
  - platform: ledc
    pin: GPIO3
    id: output_blue
    channel: 2
    inverted: true

light:
  - platform: rgb
    name: "Status Light"
    red: output_red
    green: output_green
    blue: output_blue
    id: status_light
    effects:
      - lambda:
          name: "Occupied" # Static Orange
          update_interval: never
          lambda: |-
            auto call = id(status_light).turn_on();
            call.set_rgb(1, .5, 0);
            call.set_brightness(.5);
            call.perform();

