output:
  - platform: ledc
    pin: GPIO46
    id: output_red
    channel: 0
    inverted: true
  - platform: ledc
    pin: GPIO10
    id: output_green
    channel: 1
    inverted: true
  - platform: ledc
    pin: GPIO3
    id: output_blue
    channel: 2
    inverted: true

light:
  - platform: rgb
    name: "Status Light"
    red: output_red
    green: output_green
    blue: output_blue
    effects:
      - lambda:
          name: "Occupied" # Static Orange
          update_interval: never
          lambda: |-
            it.all().set_rgb(1.0, 0.5, 0.0);
            it.all().set_brightness(0.1);
