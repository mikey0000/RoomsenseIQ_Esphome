output:
  - platform: ledc
    pin: GPIO46
    id: output_red
    channel: 0
    inverted: true
  - platform: ledc
    pin: GPIO10
    id: output_green
    channel: 1
    inverted: true
  - platform: ledc
    pin: GPIO3
    id: output_blue
    channel: 2
    inverted: true

light:
  - platform: rgb
    name: "Status Light"
    red: output_red
    green: output_green
    blue: output_blue
    id: status_light
    effects:
      - lambda:
          name: "Occupied" # Static Orange
          update_interval: never
          lambda: |-
            auto call = id(status_light).turn_on();
            call.set_rgb(1, .5, 0);
            call.set_brightness(.5);
            call.perform();
      - lambda:
          name: "Vacant" # Static Blue
          update_interval: never
          lambda: |-
            auto call = id(status_light).turn_on();
            call.set_rgb(0, 0, 1);
            call.set_brightness(.5);
            call.perform();
      - strobe:
          name: "Elevated Airborne Pollution" # Flashing yellow
          colors:
            - state: true
              brightness: 75%
              red: 100%
              green: 90%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 250ms
      - strobe:
          name: "Extreme Airborne Pollution" # Flashing purple
          colors:
            - state: true
              brightness: 75%
              red: 100%
              green: 0%
              blue: 100%
              duration: 500ms
            - state: false
              duration: 250ms
      - strobe:
          name: "Wifi Disconnected"
          colors:
            - state: true
              brightness: 75%
              red: 100%
              green: 50%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 250ms
            - state: true
              brightness: 75%
              red: 0%
              green: 0%
              blue: 50%
              duration: 500ms
            - state: false
              duration: 250ms